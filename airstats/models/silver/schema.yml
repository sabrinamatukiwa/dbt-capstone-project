version: 2

models:
  - name: silver_airports
    description: "Cleaned airport data used as the main airport reference table."
    columns:
      - name: airport_ident
        description: "{{ doc('airport_ident') }}"
        tests:
          - unique
          - not_null

      - name: airport_type
        description: "Type or category of the airport."

      - name: airport_name
        description: "Name of the airport."

      - name: airport_lat
        description: "Latitude coordinate of the airport."

      - name: airport_long
        description: "Longitude coordinate of the airport."

      - name: continent
        description: "Continent where the airport is located."

      - name: iso_country
        description: "ISO country code associated with the airport."

      - name: iso_region
        description: "ISO region code associated with the airport."

  - name: silver_runways
    description: "Cleaned runway information associated with airports."
    columns:
      - name: runway_id
        description: "Unique identifier of the runway."
        tests:
          - unique
          - not_null

      - name: airport_ident
        description: "Identifier of the airport associated with the runway."
        tests:
          - relationships:
              arguments:
                to: ref('silver_airports')
                field: airport_ident
              config:
                severity: warn

      - name: runway_length_ft
        description: "Length of the runway in feet."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: runway_width_ft
        description: "Width of the runway in feet."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

      - name: runway_surface
        description: "Surface material of the runway. Missing values are represented as __UNKNOWN__."
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null

      - name: runway_lighted
        description: "Indicates whether the runway is lighted."

      - name: runway_closed
        description: "Indicates whether the runway is closed."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: silver_airport_comments
    description: "Cleaned airport comments loaded incrementally from the source data."
    columns:
      - name: comment_id
        description: "Unique identifier of the airport comment."
        tests:
          - unique
          - not_null

      - name: airport_ident
        description: "Identifier of the airport associated with the comment."
        tests:
          - relationships:
              arguments:
                to: ref('silver_airports')
                field: airport_ident
              config:
                severity: warn

      - name: comment_timestamp
        description: "Timestamp associated with the airport comment."

      - name: member_nickname
        description: "Nickname of the member who submitted the comment. Missing values are represented as __UNKNOWN__."

      - name: comment_subject
        description: "Subject of the airport comment."

      - name: comment_body
        description: "Text content of the airport comment."

      - name: loaded_at
        description: "Timestamp indicating when the record was loaded into the Silver model."